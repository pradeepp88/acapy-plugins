label: kmslite-kanon-oid4vc

admin: [0.0.0.0, 3001]
admin-insecure-mode: true

inbound-transport:
  - [http, 0.0.0.0, 3000]
outbound-transport: http
endpoint:
  - http://localhost:3000

no-ledger: true

plugin:
  - kmslite.v1_0
  - oid4vc
  - jwt_vc_json
  - sd_jwt_vc

# oid4vc's setup() raises ConfigError without these. They are NOT read from
# this file — `plugin-config-value` here is ignored — so export them in the
# environment before starting:
#   OID4VCI_HOST=0.0.0.0
#   OID4VCI_PORT=8081
#   OID4VCI_ENDPOINT=http://localhost:8081
# oid4vc runs its own issuer server on that port, separate from the admin API.

# Kanon keeps records in the DBStore but still uses Askar for key management,
# so both stores must be configured. See docs/features/KanonStorage.md.
wallet-type: kanon-anoncreds
wallet-name: kmslite_kanon_oid4vc
wallet-key: kms.storage.secret
wallet-storage-type: sqlite

dbstore-storage-type: sqlite
dbstore-schema-config: normalize

auto-provision: true

log-level: info
